<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://hnbbjohjobvclinxclbw.supabase.co wss://hnbbjohjobvclinxclbw.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
    <title>Sorteio — Abrigo da Márcia</title>
    <link rel="shortcut icon" href="../../favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../../styles/sorteio.css?v=2">
</head>
<body>

    <!-- ── Controles do admin (ocultáveis para a transmissão) ── -->
    <div class="controls">
        <img src="../../assets/images/AbrigodaMarcia_logo.png" alt="Logo">
        <select id="event-select" aria-label="Escolher rifa">
            <option value="">Carregando rifas…</option>
        </select>
        <select id="prize-select" aria-label="Escolher prêmio">
            <option value="">Prêmios…</option>
        </select>
        <button class="btn btn-ghost" id="reload-btn" title="Recarregar números pagos">Atualizar números</button>
        <span class="spacer"></span>
        <button class="btn btn-ghost" id="hide-controls-btn">Ocultar controles</button>
        <a class="btn btn-ghost" href="eventos.html">Voltar ao admin</a>
    </div>
    <button class="btn btn-ghost show-controls" id="show-controls-btn">Mostrar controles</button>

    <!-- ── Palco ── -->
    <main class="stage">
        <h1 class="event-name" id="stage-event-name">Sorteio</h1>
        <div class="event-prize" id="stage-prize"></div>
        <div class="pool-info" id="stage-pool"></div>

        <div class="number-circle" id="number-circle">
            <span class="number" id="stage-number">?</span>
        </div>

        <div class="winner-name" id="stage-winner"></div>
        <div class="stage-alert" id="stage-alert"></div>

        <div class="stage-actions" id="stage-actions"></div>
        <p class="hint" id="stage-hint"></p>
    </main>

    <script type="module" src="../../js/pages/admin-sorteio.js?v=2"></script>
</body>
</html>
